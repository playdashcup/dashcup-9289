name: CI

on:
  pull_request:
  push:
    branches: [main, staging, 'codex/**']

permissions:
  contents: read

jobs:
  game-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Expo game dependencies
        run: bun install --frozen-lockfile
        working-directory: games/expo-crossy-road
      - name: Audit canonical Expo Bun lockfile
        run: bun audit
        working-directory: games/expo-crossy-road

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Expo game dependencies
        run: bun install --frozen-lockfile
        working-directory: games/expo-crossy-road
      - name: Lint Expo game source
        run: bunx expo lint
        working-directory: games/expo-crossy-road
      - name: Build Expo game for web into Worker assets
        run: bunx expo export -p web --output-dir ../../server/game-dist
        working-directory: games/expo-crossy-road
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler types
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm exec wrangler deploy --dry-run --env staging
      - run: pnpm exec wrangler deploy --dry-run --env=""
